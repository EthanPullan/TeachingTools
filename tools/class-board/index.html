  inner.appendChild(ctl);

  const meta = mk('div', 'pk-meta');
  const lab = mk('label'); const nr = mk('input'); nr.type = 'checkbox';
  lab.append(nr, 'No repeats');
  lab.title = 'Everyone gets a turn before anyone is picked twice';
  const left = mk('span', 'left');
  const bReset = miniBtn('↺', 'Put everyone back in');
  meta.append(lab, left, bReset);
  inner.appendChild(meta);

  let editing = false, spinning = false;
  const pool = () => {
    if(item.src){
      const c = readRosters().find(c => c.name === item.src);
      if(c) return [...new Set(c.students.map(s => String(s).trim()).filter(Boolean))];
    }
    return [...new Set((item.names || []).map(s => String(s).trim()).filter(Boolean))];
  };
  const avail = () => { const all = pool(), p = new Set(item.picked); return item.noRepeat ? all.filter(n => !p.has(n)) : all; };

  function fillSources(){
    const r = readRosters();
    src.innerHTML = '';
    r.forEach(c=>{ const o = mk('option', null, c.name + ' (' + c.students.length + ')'); o.value = c.name; src.appendChild(o); });
    const o = mk('option', null, 'My own list…'); o.value = ''; src.appendChild(o);
    // a class that has since been removed from Class Lists: fall back to own list
    if(item.src && !r.some(c => c.name === item.src)) item.src = '';
    src.value = item.src || '';
  }
  function show(txt, cls){
    name.className = 'pk-name' + (cls ? ' ' + cls : '');
    name.textContent = txt;
    fitName();
  }
  function fitName(){
    if(name.classList.contains('idle')){ name.style.fontSize = ''; return; }
    name.style.fontSize = fitFont(name.textContent, stage.clientWidth - 6, stage.clientHeight - 6, 800, 150) + 'px';
  }
  function render(){
    fillSources();
    const all = pool();
    const showEdit = editing || (!item.src && !all.length);
    stage.style.display = showEdit ? 'none' : '';
    names.style.display = help.style.display = showEdit ? '' : 'none';
    help.style.display = showEdit && !readRosters().length ? '' : 'none';
    if(showEdit) names.value = (item.names || []).join('\n');
    bEdit.style.display = item.src ? 'none' : '';
    bEdit.classList.toggle('on', editing);
    nr.checked = !!item.noRepeat;
    bReset.style.display = item.noRepeat ? '' : 'none';
    left.textContent = item.noRepeat ? avail().length + ' of ' + all.length + ' left' : all.length + ' names';
    bGo.disabled = !all.length || spinning;
    if(!showEdit && !spinning){
      if(item.last && all.includes(item.last)) show(item.last);
      else show(all.length ? 'Press Pick to choose a student' : 'No names yet', 'idle');
    }
  }
  function pick(){
    if(spinning) return;
    if(editing){ editing = false; }
    let cand = avail();
    if(!cand.length){
      item.picked = []; cand = pool();
      if(!cand.length) return;
      toast('Everyone has had a turn — starting again.');
    }
    const chosen = cand[Math.floor(Math.random() * cand.length)];
    const finish = () => {
      spinning = false;
      item.last = chosen;
      if(item.noRepeat && !item.picked.includes(chosen)) item.picked.push(chosen);
      render(); name.classList.add('land'); save();
    };
    stage.style.display = ''; names.style.display = help.style.display = 'none';
    if(REDUCED || cand.length < 2){ finish(); return; }
    // flick through names, slowing down, then land on the chosen one
    spinning = true; bGo.disabled = true;
    const all = pool();
    let delay = 45, prev = '';
    const step = () => {
      if(delay > 260){ finish(); return; }
      let n; do{ n = all[Math.floor(Math.random() * all.length)]; }while(all.length > 1 && n === prev);
      prev = n; show(n, 'spin');
      delay *= 1.14;
      setTimeout(step, delay);
    };
    step();
  }
  bGo.addEventListener('click', pick);
  bEdit.addEventListener('click', ()=>{ editing = !editing; render(); if(editing) names.focus(); });
  names.addEventListener('input', ()=>{
    item.names = names.value.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
    const all = new Set(item.names);
    item.picked = item.picked.filter(n => all.has(n));
    left.textContent = item.noRepeat ? avail().length + ' of ' + pool().length + ' left' : pool().length + ' names';
    bGo.disabled = !pool().length;
    save();
  });
  src.addEventListener('mousedown', fillSources);        // pick up classes added in another tab
  src.addEventListener('change', ()=>{
    item.src = src.value; item.picked = []; item.last = '';
    editing = !item.src && !pool().length;
    render(); save();
    if(editing) names.focus();
  });
  nr.addEventListener('change', ()=>{ item.noRepeat = nr.checked; if(!nr.checked) item.picked = []; render(); save(); });
  bReset.addEventListener('click', ()=>{ item.picked = []; item.last = ''; render(); save(); toast('Everyone is back in.'); });
  if(window.ResizeObserver) new ResizeObserver(()=> fitName()).observe(stage);
  render();
  const entry = { render: ()=>{ if(!spinning && !editing) render(); } };
  pickerEls.add(entry);
  item._reg = { set: pickerEls, entry };
}
// another tab (home page / Seating Chart) changed Class Lists
window.addEventListener('storage', e=>{ if(e.key === ROSTER_LS) pickerEls.forEach(p => p.render()); });

/* ---------------- poll (smiley faces, thumbs, yes/no, fist to five, custom) ---------------- */
const POLL_FACES = [
  { label:'Great',     c:'#2e9d57', k:20  },
  { label:'Good',      c:'#8bc34a', k:10  },
  { label:'Okay',      c:'#f2c12e', k:0   },
  { label:'Not great', c:'#f08a3c', k:-10 },
  { label:'Bad',       c:'#d8443a', k:-18 },
];
const POLL_PALETTE = ['#2f6f9f','#e0982e','#7a52c0','#3f9e6b','#c43d35','#1f8a8a','#b5568c','#6b7a2f'];
const POLL_MODES = {
  faces:   { name:'Smiley faces' },
  thumbs:  { name:'Thumbs',       labels:['Got it','Sort of','Not yet'], glyphs:['👍','✋','👎'], colors:['#2e9d57','#f2c12e','#d8443a'] },
  yesno:   { name:'Yes / No',     labels:['Yes','Not sure','No'],        glyphs:['✓','?','✗'],   colors:['#2e9d57','#f2c12e','#d8443a'] },
  fist:    { name:'Fist to five', labels:['0','1','2','3','4','5'],      colors:['#d8443a','#ec6c3b','#f2a52e','#e3c52c','#93c047','#2e9d57'] },
  choices: { name:'Custom choices' },
};
const POLL_MAX_OPTIONS = 8;
// Labels, colours and (optional) glyphs for an item's current poll type.
function pollCfg(item){
  if(item.mode === 'faces') return { labels:POLL_FACES.map(f=>f.label), colors:POLL_FACES.map(f=>f.c), faces:true };
  if(item.mode === 'choices'){
    const labels = (item.options && item.options.length) ? item.options : ['A','B','C','D'];
    // short choices (A, B, Yes…) go on the tile; longer ones get a letter tile + label underneath
    const short = labels.every(l => l.length <= 3);
    return { labels, colors:labels.map((_,i)=>POLL_PALETTE[i % POLL_PALETTE.length]),
      glyphs: short ? labels : labels.map((_,i)=> String.fromCharCode(65 + i)), sublabel: !short };
  }
  const m = POLL_MODES[item.mode] || POLL_MODES.thumbs;
  return { labels:m.labels, colors:m.colors, glyphs:m.glyphs || m.labels };
}
function faceSvg(f){
  const svg = svgEl('svg', { viewBox:'0 0 100 100', 'aria-hidden':'true' });
  svg.appendChild(svgEl('circle', { cx:50, cy:50, r:46, fill:f.c, stroke:'rgba(0,0,0,.18)', 'stroke-width':3 }));
  svg.appendChild(svgEl('ellipse', { cx:36, cy:26, rx:17, ry:9, fill:'rgba(255,255,255,.28)', transform:'rotate(-25 36 26)' }));
  const ink = '#2a2118';
  svg.appendChild(svgEl('ellipse', { cx:35, cy:40, rx:5, ry:6.5, fill:ink }));
  svg.appendChild(svgEl('ellipse', { cx:65, cy:40, rx:5, ry:6.5, fill:ink }));
  if(f.k <= -18){   // worried brows on the saddest face
    svg.appendChild(svgEl('path', { d:'M26 29 L42 25', stroke:ink, 'stroke-width':4, 'stroke-linecap':'round' }));
    svg.appendChild(svgEl('path', { d:'M74 29 L58 25', stroke:ink, 'stroke-width':4, 'stroke-linecap':'round' }));
  }
  const y = f.k >= 0 ? 62 : 72;
  const d = f.k === 0 ? 'M32 66 L68 66' : 'M29 ' + y + ' Q50 ' + (y + f.k*1.3) + ' 71 ' + y;
  svg.appendChild(svgEl('path', { d, fill:'none', stroke:ink, 'stroke-width':6, 'stroke-linecap':'round' }));
  return svg;
}
function pollTally(item, cfg){
  const votes = item.votes, total = votes.reduce((a,b)=>a+b, 0);
  let summary = '';
  if(total){
    if(item.mode === 'faces'){
      // 5 = Great … 1 = Bad
      const avg = votes.reduce((s,n,i)=> s + n*(5-i), 0) / total;
      summary = 'Class mood ' + avg.toFixed(1) + ' / 5 · ' + POLL_FACES[clamp(Math.round(5-avg),0,4)].label;
    }else if(item.mode === 'fist'){
      const avg = votes.reduce((s,n,i)=> s + n*i, 0) / total;
      summary = 'Average ' + avg.toFixed(1) + ' / 5';
    }else{
      const max = Math.max(...votes), top = votes.map((n,i)=> n===max ? i : -1).filter(i=>i>=0);
      summary = top.length > 1 ? 'Tie: ' + top.map(i=>cfg.labels[i]).join(' / ')
                               : 'Most votes: ' + cfg.labels[top[0]] + ' (' + Math.round(max/total*100) + '%)';
    }
  }
  return { total, summary };
}
function pollText(title, mode, labels, votes){
  const total = votes.reduce((a,b)=>a+b, 0);
  const lines = [(title || 'Poll') + ' — ' + (POLL_MODES[mode] ? POLL_MODES[mode].name : 'Poll')];
  labels.forEach((l,i)=> lines.push(l + ': ' + (votes[i]||0) + (total ? ' (' + Math.round((votes[i]||0)/total*100) + '%)' : '')));
  lines.push('Total: ' + total + ' vote' + (total===1?'':'s'));
  const s = pollTally({ mode, votes }, { labels }).summary;
  if(s) lines.push(s);
  return lines.join('\n');
}
function copyText(txt){
  const fallback = ()=>{
    const ta = mk('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove();
    toast(ok ? 'Results copied.' : 'Couldn’t copy — your browser blocked it.', ok ? 'ok' : 'err');
  };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(()=> toast('Results copied.', 'ok'), fallback);
  else fallback();
}
function tick(){
  const ac = audioCtx; if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'triangle'; o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(990, t + .08);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.15, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + .18);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .2);
}

function buildPoll(item, inner, el){
  if(!Array.isArray(item.votes)) item.votes = [];
  if(!Array.isArray(item.log)) item.log = [];
  if(!Array.isArray(item.rounds)) item.rounds = [];

  const head = mk('div', 'head');
  const sel = mk('select', 'pl-mode');
  sel.setAttribute('aria-label', 'Poll type');
  for(const k in POLL_MODES){ const o = mk('option', null, POLL_MODES[k].name); o.value = k; sel.appendChild(o); }
  head.append(titleInput(item, 'Poll question'), sel);
  inner.appendChild(head);

  const body = mk('div', 'pl-body');
  const opts = mk('div', 'pl-vote');
  const sum = mk('div', 'pl-sum');
  const res = mk('div', 'pl-res');
  const edit = mk('textarea', 'pl-edit');
  edit.placeholder = 'One choice per line (up to ' + POLL_MAX_OPTIONS + ')';
  edit.setAttribute('aria-label', 'Poll choices');
  const hist = mk('div', 'pl-hist');
  body.append(opts, sum, res, edit, hist);
  inner.appendChild(body);

  const foot = mk('div', 'pl-foot hov');
  const bUndo  = miniBtn('↶ Undo', 'Take back the last vote');
  const bHide  = miniBtn('', 'Hide or show the results');
  const bLock  = miniBtn('', 'Close or open voting');
  const bSave  = miniBtn('Save round', 'Keep these results in History and start a fresh round');
  const bReset = miniBtn('Reset', 'Clear all votes');
  const bCopy  = miniBtn('Copy', 'Copy the results as text');
  const bHist  = miniBtn('', 'Past rounds');
  const bEdit  = miniBtn('✎ Choices', 'Edit the choices');
  const bSnd   = miniBtn('', 'Sound on each vote');
  foot.append(bUndo, bHide, bLock, bSave, bReset, bCopy, bHist, bEdit, bSnd);
  inner.appendChild(foot);

  let view = 'vote';            // 'vote' | 'edit' | 'hist'
  let optEls = [], cfg = null, cooling = false;

  function fitVotes(){
    const n = cfg.labels.length;
    item.votes = Array.from({ length:n }, (_,i)=> item.votes[i] || 0);
    item.log = item.log.filter(i => i < n);
  }
  function buildOptions(){
    cfg = pollCfg(item); fitVotes();
    opts.innerHTML = ''; optEls = [];
    cfg.labels.forEach((label, i)=>{
      const b = mk('button', 'pl-opt'); b.type = 'button';
      b.setAttribute('aria-label', 'Vote: ' + label);
      const art = mk('span', 'pl-art' + (cfg.faces ? ' face' : ''));
      if(cfg.faces) art.appendChild(faceSvg(POLL_FACES[i]));
      else{
        const g = mk('span', 'pl-glyph' + ([...cfg.glyphs[i]].length > 1 ? ' long' : ''), cfg.glyphs[i]);
        g.style.background = cfg.colors[i];
        art.appendChild(g);
      }
      const badge = mk('span', 'pl-badge'); art.appendChild(badge);
      b.appendChild(art);
      if(cfg.faces || cfg.sublabel || item.mode === 'thumbs' || item.mode === 'yesno'){
        const lab = mk('span', 'pl-lab', label); lab.title = label; b.appendChild(lab);
      }else b.classList.add('nolab');
      b.addEventListener('click', ()=> vote(i));
      opts.appendChild(b); optEls.push({ b, badge });
    });
    el.classList.toggle('many', cfg.labels.length > 5);
  }
  function render(){
    sel.value = item.mode;
    const { total, summary } = pollTally(item, cfg);
    el.classList.toggle('locked', !!item.locked);
    opts.style.display = view === 'vote' ? '' : 'none';
    sum.style.display = view === 'vote' ? '' : 'none';
    res.style.display = view === 'vote' && !item.hidden ? '' : 'none';
    edit.style.display = view === 'edit' ? '' : 'none';
    hist.style.display = view === 'hist' ? '' : 'none';

    optEls.forEach(({ badge }, i)=>{
      badge.textContent = item.votes[i];
      badge.style.display = item.hidden || !item.votes[i] ? 'none' : '';
    });
    sum.innerHTML = '';
    const tot = mk('b', null, total + ' vote' + (total===1?'':'s'));
    sum.appendChild(tot);
    if(item.locked) sum.appendChild(mk('span', 'pl-tag', 'Closed'));
    if(item.hidden) sum.appendChild(mk('span', null, total ? 'results hidden' : 'tap to vote'));
    else if(summary) sum.appendChild(mk('span', null, summary));
    else sum.appendChild(mk('span', null, item.locked ? 'voting is closed' : 'tap a choice to vote'));

    res.innerHTML = '';
    if(!item.hidden){
      const max = Math.max(1, ...item.votes);
      cfg.labels.forEach((label, i)=>{
        const n = item.votes[i];
        const row = mk('div', 'pl-row');
        const lab = mk('span', 'pl-rl', (cfg.faces || !cfg.glyphs || cfg.glyphs[i] === label) ? label : cfg.glyphs[i] + ' ' + label);
        const tr = mk('span', 'pl-track'), fill = mk('i', 'pl-fill');
        fill.style.width = (n / max * 100) + '%'; fill.style.background = cfg.colors[i];
        tr.appendChild(fill);
        row.append(lab, tr, mk('span', 'pl-n', n + (total ? ' · ' + Math.round(n/total*100) + '%' : '')));
        res.appendChild(row);
      });
    }
    if(view === 'hist') renderHist();

    bUndo.disabled = !item.log.length;
    bHide.textContent = item.hidden ? '👁 Show' : '🙈 Hide';
    bLock.textContent = item.locked ? '🔓 Open' : '🔒 Close';
    bLock.classList.toggle('on', !!item.locked);
    bHist.textContent = view === 'hist' ? '← Back' : 'History' + (item.rounds.length ? ' (' + item.rounds.length + ')' : '');
    bHist.classList.toggle('on', view === 'hist');
    bEdit.style.display = item.mode === 'choices' ? '' : 'none';
    bEdit.classList.toggle('on', view === 'edit');
    bSnd.textContent = item.sound ? '🔔' : '🔕';
    bSnd.classList.toggle('on', !!item.sound);
  }
  function renderHist(){
    hist.innerHTML = '';
    if(!item.rounds.length){
      hist.appendChild(mk('div', 'pl-empty', 'No saved rounds yet. “Save round” keeps the current results here and starts fresh.'));
      return;
    }
    const df = new Intl.DateTimeFormat(undefined, { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    item.rounds.forEach((r, ri)=>{
      const row = mk('div', 'pl-hrow');
      const top = mk('div', 'pl-htop');
      top.append(mk('b', null, r.title || 'Poll'), mk('span', null, df.format(new Date(r.at))));
      const cp = miniBtn('Copy', 'Copy this round');
      cp.addEventListener('click', ()=> copyText(pollText(r.title, r.mode, r.labels, r.votes)));
      const rm = miniBtn('×', 'Delete this round');
      rm.addEventListener('click', ()=>{ item.rounds.splice(ri, 1); render(); save(); });
      top.append(cp, rm);
      const total = r.votes.reduce((a,b)=>a+b, 0);
      const line = r.labels.map((l,i)=> l + ' ' + r.votes[i]).join(' · ');
      const s = pollTally({ mode:r.mode, votes:r.votes }, { labels:r.labels }).summary;
      row.append(top, mk('div', 'pl-hline', line + ' — ' + total + ' total' + (s ? '. ' + s : '')));
      hist.appendChild(row);
    });
  }

  function vote(i){
    if(item.locked){ toast('Voting is closed — click 🔓 Open to start again.'); return; }
    if(cooling || view !== 'vote') return;
    item.votes[i]++; item.log.push(i);
    if(item.log.length > 1000) item.log.splice(0, item.log.length - 1000);
    if(item.sound){ audio(); tick(); }
    const { b } = optEls[i];
    if(!REDUCED){
      b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
      const plus = mk('span', 'pl-plus', '+1'); b.firstChild.appendChild(plus);
      setTimeout(()=> plus.remove(), 800);
    }
    // short pause so a double-tap from one student counts once
    cooling = true; el.classList.add('cool');
    setTimeout(()=>{ cooling = false; el.classList.remove('cool'); }, 600);
    render(); save();
  }
  function resetVotes(){ item.votes = item.votes.map(()=>0); item.log = []; }

  bUndo.addEventListener('click', ()=>{
    const i = item.log.pop();
    if(i != null && item.votes[i] > 0) item.votes[i]--;
    render(); save();
  });
  bHide.addEventListener('click', ()=>{ item.hidden = !item.hidden; render(); save(); });
  bLock.addEventListener('click', ()=>{ item.locked = !item.locked; render(); save(); });
  bReset.addEventListener('click', ()=>{
    if(item.votes.some(n=>n) && !confirm('Clear all votes on this poll?')) return;
    resetVotes(); render(); save();
  });
  bSave.addEventListener('click', ()=>{
    if(!item.votes.some(n=>n)){ toast('No votes yet — nothing to save.', 'err'); return; }
    item.rounds.unshift({ at:Date.now(), title:item.title, mode:item.mode, labels:cfg.labels.slice(), votes:item.votes.slice() });
    if(item.rounds.length > 50) item.rounds.length = 50;
    resetVotes(); item.locked = false; render(); save();
    toast('Round saved — ready for a fresh vote.', 'ok');
  });
  bCopy.addEventListener('click', ()=> copyText(pollText(item.title, item.mode, cfg.labels, item.votes)));
  bHist.addEventListener('click', ()=>{ view = view === 'hist' ? 'vote' : 'hist'; render(); });
  bEdit.addEventListener('click', ()=>{
    view = view === 'edit' ? 'vote' : 'edit';
    if(view === 'edit'){ edit.value = cfg.labels.join('\n'); render(); edit.focus(); } else render();
  });
  bSnd.addEventListener('click', ()=>{ item.sound = !item.sound; if(item.sound){ audio(); tick(); } render(); save(); });
  edit.addEventListener('input', ()=>{
    const lines = edit.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0, POLL_MAX_OPTIONS);
    item.options = lines.length ? lines : null;
    buildOptions(); render(); save();
  });
  edit.addEventListener('keydown', e=>{ if(e.key === 'Escape'){ view = 'vote'; render(); } });
  sel.addEventListener('change', ()=>{
    if(item.votes.some(n=>n) && !confirm('Changing the poll type clears the current votes. Continue?')){ sel.value = item.mode; return; }
    item.mode = sel.value; resetVotes();
    buildOptions();
    view = 'vote'; render(); save();
  });
  // number keys vote while the poll has focus (0–5 for fist to five, else 1…n)
  el.addEventListener('keydown', e=>{
    if(e.target.closest('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey) return;
    if(!/^[0-9]$/.test(e.key)) return;
    const i = item.mode === 'fist' ? +e.key : +e.key - 1;
    if(i >= 0 && i < cfg.labels.length){ e.preventDefault(); vote(i); }
  });

  buildOptions(); render();
}

/* ---------------- board background ---------------- */
const BG_IMG_KEY = STORE_KEY + '.bgimage';
const BG_PRESETS = [
  { id:'cork',  name:'Cork' },
  { id:'chalk', name:'Chalkboard' },
  { id:'black', name:'Blackboard' },
  { id:'white', name:'Whiteboard', light:true },
  { id:'grid',  name:'Grid paper', light:true },
  { id:'felt',  name:'Green felt' },
  { id:'blue',  name:'Blue felt' },
  { id:'red',   name:'Red felt' },
];
let bgImage = null;                    // data: URL of an uploaded background
try{ bgImage = localStorage.getItem(BG_IMG_KEY); }catch(e){}

function isLightColor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if(!m) return false;
  const n = parseInt(m[1], 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.62;
}
function applyBg(){
  const bg = state.bg || DEFAULT_BG;
  surface.style.backgroundColor = ''; surface.style.backgroundImage = '';
  let cls = 'bg-cork', light = false;
  if(bg.kind === 'color'){ cls = 'bg-solid'; surface.style.backgroundColor = bg.color; light = isLightColor(bg.color); }
  else if(bg.kind === 'image' && bgImage){ cls = 'bg-image'; surface.style.backgroundImage = 'url("' + bgImage + '")'; }
  else if(bg.kind === 'preset'){
    const p = BG_PRESETS.find(p => p.id === bg.id) || BG_PRESETS[0];
    cls = 'bg-' + p.id; light = !!p.light;
  }
  surface.className = 'surface bgv ' + cls + (light ? ' light' : '');
  renderBgGrid();
}
function setBg(bg){ state.bg = bg; applyBg(); save(); }
function renderBgGrid(){
  const grid = $('bgGrid'); grid.innerHTML = '';
  const bg = state.bg || DEFAULT_BG;
  BG_PRESETS.forEach(p=>{
    const b = mk('button', 'bg-opt' + (bg.kind === 'preset' && bg.id === p.id ? ' on' : ''));
    b.type = 'button';
    b.append(mk('span', 'sw bgv bg-' + p.id), mk('span', 'n', p.name));
    b.addEventListener('click', ()=> setBg({ kind:'preset', id:p.id }));
    grid.appendChild(b);
  });
  if(bgImage){
    const b = mk('button', 'bg-opt' + (bg.kind === 'image' ? ' on' : ''));
    b.type = 'button';
    const sw = mk('span', 'sw'); sw.style.background = 'center/cover url("' + bgImage + '")';
    b.append(sw, mk('span', 'n', 'My image'));
    b.addEventListener('click', ()=> setBg({ kind:'image' }));
    grid.appendChild(b);
  }
  if(bg.kind === 'color') $('bgColor').value = bg.color;
}
// Downscale an uploaded picture so it fits comfortably in browser storage.
function loadBgFile(file){
  if(!file || !/^image\//.test(file.type)){ toast('That isn’t an image file.', 'err'); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    URL.revokeObjectURL(url);
    let stored = false, data = null;
    for(const [max, q] of [[2200, .85], [1600, .78], [1100, .7]]){
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);    // flatten transparency
      g.drawImage(img, 0, 0, c.width, c.height);
      data = c.toDataURL('image/jpeg', q);
      try{ localStorage.setItem(BG_IMG_KEY, data); stored = true; break; }catch(e){}
    }
    bgImage = data;
    setBg({ kind:'image' });
    toast(stored ? 'Background set.' : 'Background set for now — the browser had no room to save it.', stored ? 'ok' : 'err');
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); toast('Couldn’t open that image.', 'err'); };
  img.src = url;
}
function openBgPop(){
  const pop = $('bgPop');
  if(pop.style.display !== 'none'){ closeBgPop(); return; }
  renderBgGrid();
  pop.style.display = 'block';
  const r = $('bgBtn').getBoundingClientRect();
  pop.style.left = clamp(r.right - pop.offsetWidth, 8, window.innerWidth - pop.offsetWidth - 8) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
  setTimeout(()=> document.addEventListener('pointerdown', bgOutside, true), 0);
}
function bgOutside(e){ if(!e.target.closest('#bgPop') && !e.target.closest('#bgBtn')) closeBgPop(); }
function closeBgPop(){
  $('bgPop').style.display = 'none';
  document.removeEventListener('pointerdown', bgOutside, true);
}
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && $('bgPop').style.display !== 'none') closeBgPop(); });

/* ---------------- dragging ---------------- */
function attachDrag(item, el, pin){
  let downX=0,downY=0,offX=0,offY=0,moved=false,dragging=false;
  let lastX=0,lastY=0,zoomAtDown=1,panRAF=0;

  // place the item under the (possibly stationary) pointer, in surface coords
  function applyFromPointer(){
    const p = toSurface(lastX, lastY);
    item.x = Math.round(clamp(p.x - offX, 0, BIG));
    item.y = Math.round(clamp(p.y - offY, 0, BIG));
    el.style.left=item.x+'px'; el.style.top=item.y+'px';
    fitBoard();
  }
  // auto-pan the viewport when dragging near an edge (lets the canvas grow)
  function panLoop(){
    if(!dragging){ panRAF=0; return; }
    const wr = boardWrap.getBoundingClientRect(), EDGE=48, MAX=22;
    let sx=0, sy=0;
    if(lastX > wr.right-EDGE)     sx =  MAX*Math.min(1,(lastX-(wr.right-EDGE))/EDGE);
    else if(lastX < wr.left+EDGE) sx = -MAX*Math.min(1,((wr.left+EDGE)-lastX)/EDGE);
    if(lastY > wr.bottom-EDGE)    sy =  MAX*Math.min(1,(lastY-(wr.bottom-EDGE))/EDGE);
    else if(lastY < wr.top+EDGE)  sy = -MAX*Math.min(1,((wr.top+EDGE)-lastY)/EDGE);
    if(sx||sy){
      boardWrap.scrollLeft = Math.max(0, boardWrap.scrollLeft + sx);
      boardWrap.scrollTop  = Math.max(0, boardWrap.scrollTop  + sy);
      applyFromPointer();
    }
    panRAF = requestAnimationFrame(panLoop);
  }

  el.addEventListener('pointerdown', e=>{
    if(e.button!=null && e.button!==0) return;
    const t = e.target;
    if(t.closest('.x') || t.closest('.rs')) return;               // delete / resize handle themselves
    // Edit controls handle their own pointer events; the pin (and bare
    // paper chrome) start a drag.
    if(t.closest('input,textarea,select,label,button:not(.pin),.swatch,.cal-day,.cal-nav,.mtitle,.add,.rm,.seg,.tx-bar') && !t.closest('.pin')) return;

    bringToFront(item, el);
    moved=false; dragging=true; zoomAtDown = state.zoom||1;
    downX=e.clientX; downY=e.clientY; lastX=e.clientX; lastY=e.clientY;
    const r = el.getBoundingClientRect();
    offX = (e.clientX - r.left)/zoomAtDown; offY = (e.clientY - r.top)/zoomAtDown;
    el.setPointerCapture(e.pointerId);
    el.classList.add('lift','dragging-this');
    boardWrap.classList.add('dragging');
    e.preventDefault();

    const move = ev=>{
      if(!dragging) return;
      lastX=ev.clientX; lastY=ev.clientY;
      if(!moved && Math.abs(ev.clientX-downX)+Math.abs(ev.clientY-downY) > 3){
        moved=true; if(!panRAF) panRAF=requestAnimationFrame(panLoop);
      }
      if(moved) applyFromPointer();
    };
    const up = ()=>{
      dragging=false;
      if(panRAF){ cancelAnimationFrame(panRAF); panRAF=0; }
      el.releasePointerCapture(e.pointerId);
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      el.classList.remove('lift','dragging-this');
      boardWrap.classList.remove('dragging');
      if(moved){ fitBoard(); save(); }
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });

  // keyboard nudging when the pin is focused
  pin.addEventListener('keydown', e=>{
    const step = e.shiftKey ? 1 : 12;
    let dx=0,dy=0;
    if(e.key==='ArrowLeft') dx=-step; else if(e.key==='ArrowRight') dx=step;
    else if(e.key==='ArrowUp') dy=-step; else if(e.key==='ArrowDown') dy=step; else return;
    e.preventDefault();
    bringToFront(item, el);
    item.x = Math.round(clamp(item.x+dx, 0, BIG));
    item.y = Math.round(clamp(item.y+dy, 0, BIG));
    el.style.left=item.x+'px'; el.style.top=item.y+'px';
    fitBoard(); save();
  });
}

/* ---------------- resizing (drag the bottom-right corner) ---------------- */
function attachResize(item, el, handle){
  handle.addEventListener('pointerdown', e=>{
    if(e.button!=null && e.button!==0) return;
    e.preventDefault(); e.stopPropagation();          // never start a drag
    bringToFront(item, el);
    const def = SIZE[item.type] || { minW:120, minH:90 };
    const z = state.zoom || 1;
    const startX=e.clientX, startY=e.clientY;
    const startW=el.offsetWidth, startH=el.offsetHeight;
    // Map the screen-space drag onto the card's own axes (divide by zoom first)
    // so resizing stays true even with the slight pinned rotation.
    const rad=(item.rot||0)*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
    handle.setPointerCapture(e.pointerId);
    el.classList.add('lift');

    const move = ev=>{
      const dx=(ev.clientX-startX)/z, dy=(ev.clientY-startY)/z;
      const ldx = dx*cos + dy*sin;        // rotate the delta by -θ
      const ldy = -dx*sin + dy*cos;
      item.w = Math.round(clamp(startW + ldx, def.minW, BIG));
      item.h = Math.round(clamp(startH + ldy, def.minH, BIG));
      el.style.width  = item.w + 'px';
      el.style.height = item.h + 'px';
      fitBoard();
    };
    const up = ()=>{
      handle.releasePointerCapture(e.pointerId);
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      el.classList.remove('lift');
      fitBoard(); save();
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
}

/* ---------------- import / export / clear ---------------- */
function exportBoard(){
  if(!state.items.length){ toast('The board is empty — nothing to export.','err'); return; }
  const out = Object.assign({}, state);
  if(state.bg && state.bg.kind==='image' && bgImage) out.bgImage = bgImage;
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='class-board.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Board exported.','ok');
}
function importBoard(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const s = JSON.parse(reader.result);
      if(!s || !Array.isArray(s.items)) throw new Error('not a board file');
      if(typeof s.bgImage === 'string' && /^data:image\//.test(s.bgImage)){
        bgImage = s.bgImage;
        try{ localStorage.setItem(BG_IMG_KEY, bgImage); }catch(e){}
      }
      delete s.bgImage;
      state = Object.assign({items:[],z:10,seq:1,bg:DEFAULT_BG}, s);
      renderAll();
      save();
      toast('Loaded ' + state.items.length + ' item' + (state.items.length===1?'':'s') + '.','ok');
    }catch(err){ toast('Couldn’t read that file — is it a board export?','err'); }
  };
  reader.readAsText(file);
}
function clearBoard(){
  if(!state.items.length){ toast('The board is already empty.'); return; }
  if(!confirm('Clear the whole board? This removes every item on it.')) return;
  state.items = [];
  renderAll(); save();
  toast('Board cleared.','ok');
}

/* ---------------- render-all (load / import) ---------------- */
function renderAll(){
  els.forEach(el=>el.remove());
  els.clear();
  countdownEls.clear(); calEls.clear(); agendaEls.clear(); liveEls.clear(); pickerEls.clear();
  // keep the z counter ahead of any restored item
  state.z = Math.max(10, ...state.items.map(i=>i.z||0));
  state.zoom = clamp(state.zoom||1, ZOOM_MIN, ZOOM_MAX);
  state.items.forEach(item=>{
    // backfill anything an older/partial file might be missing
    if(!item.pin) item.pin = pickPin();
    if(item.rot==null) item.rot = 0;
    const def = SIZE[item.type] || {};
    if(item.w==null) item.w = def.w;           // boards saved before resizing existed
    if(!('h' in item)) item.h = (def.h!==undefined ? def.h : null);
    if(item.type==='cal'){
      if(!item.dayNotes) item.dayNotes = {};
      // migrate older "marks" dots into notes so nothing is lost
      if(item.marks){ for(const k in item.marks){ if(item.marks[k] && !item.dayNotes[k]) item.dayNotes[k]='•'; } delete item.marks; }
    }
    item.x = Math.max(0, item.x||0); item.y = Math.max(0, item.y||0);
    mountCard(item, false);
  });
  applyZoom();
  applyBg();
  fitBoard();
  refreshAgendas();
  updateEmpty();
}

/* ---------------- first-run seed ---------------- */
function seed(){
  const w = boardWrap.clientWidth;
  // a blank calendar, ready for the class to use
  const cal = addCal();
  // a day countdown (instructional days to the last day of school)
  const count = addCount();
  count.title = 'Last day of school';
  // lay them out across the board
  els.get(cal.id)    && place(cal,    Math.min(w-360, 250), 22);
  els.get(count.id)  && place(count,  32, 250);
  // rebuild the ones we mutated after creation
  rebuild(cal); rebuild(count);
  updateEmpty(); fitBoard(); refreshAgendas(); save();
}
function place(item, x, y){ item.x=x; item.y=y; const el=els.get(item.id); if(el){ el.style.left=x+'px'; el.style.top=y+'px'; } }
function rebuild(item){
  const old = els.get(item.id);
  if(old){ old.remove(); els.delete(item.id); }
  if(item._reg){ item._reg.set.delete(item._reg.entry); item._reg=null; }
  mountCard(item, false);
}

/* ---------------- wire up ---------------- */
$('addNote').addEventListener('click', ()=> addNote());
$('addList').addEventListener('click', ()=> addList());
$('addCal').addEventListener('click', ()=> addCal());
$('addCount').addEventListener('click', ()=> addCount());
$('addAgenda').addEventListener('click', ()=> addAgenda());
$('addText').addEventListener('click', ()=> addText());
$('addClock').addEventListener('click', ()=> addClock());
$('addTimer').addEventListener('click', ()=> addTimer());
$('addPicker').addEventListener('click', ()=> addPicker());
$('addPoll').addEventListener('click', ()=> addPoll());
$('bgBtn').addEventListener('click', openBgPop);
$('bgColor').addEventListener('input', e=> setBg({ kind:'color', color:e.target.value }));
$('bgUpload').addEventListener('click', ()=> $('bgFile').click());
$('bgFile').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) loadBgFile(f); e.target.value=''; closeBgPop(); });
$('exportBtn').addEventListener('click', exportBoard);
$('importBtn').addEventListener('click', ()=> $('importFile').click());
$('importFile').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) importBoard(f); e.target.value=''; });
$('clearBtn').addEventListener('click', clearBoard);

// zoom / view controls
$('zoomOut').addEventListener('click', ()=> setZoom((state.zoom||1) - 0.1));
$('zoomIn').addEventListener('click',  ()=> setZoom((state.zoom||1) + 0.1));
$('zoomLvl').addEventListener('click', ()=> setZoom(1));
$('fitBtn').addEventListener('click', fitToScreen);
$('fsBtn').addEventListener('click', toggleFullscreen);
window.addEventListener('resize', fitBoard);
document.addEventListener('fullscreenchange', ()=> setTimeout(fitBoard, 60));

// double-click the bare cork to drop a note where you clicked
surface.addEventListener('dblclick', e=>{
  if(e.target!==surface) return;
  const p = toSurface(e.clientX, e.clientY);
  addNote(Math.round(p.x-90), Math.round(p.y-20));
});

/* ---------------- boot ---------------- */
if(load()){ renderAll(); }
else { seed(); }
applyBg();
applyZoom();
fitBoard();

// keep day countdowns current if the board is left open across midnight
setInterval(()=>{ countdownEls.forEach(c=>c.render()); }, 60000);
// clocks + timers
setInterval(()=>{ liveEls.forEach(c=>c.render()); }, 250);
</script>
